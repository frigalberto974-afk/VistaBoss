<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="icona-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <main id="schermata-pin" class="schermata" hidden>
    <h1>Agenda</h1>
    <p class="aiuto">Inserisci il PIN</p>
    <form id="form-pin">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN">
      <button type="submit" class="pulsante">Entra</button>
    </form>
    <p id="errore-pin" class="errore" role="alert"></p>
  </main>

  <main id="schermata-app" class="schermata" hidden>
    <section class="dialogo" aria-live="polite">
      <p id="detto" class="detto"></p>
      <p id="risposta" class="risposta">Tocca il microfono e parla.<br>Ad esempio: «Domani alle 10 vedo Rossi».</p>
    </section>

    <div id="conferma" class="conferma" hidden>
      <button id="si" class="pulsante si">Sì, confermo</button>
      <button id="no" class="pulsante no">No</button>
    </div>

    <button id="microfono" class="microfono" aria-label="Parla">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <p id="stato" class="stato">Tocca e parla</p>

    <form id="form-testo" class="form-testo">
      <input id="testo" type="text" placeholder="Oppure scrivi qui" autocomplete="off" enterkeyhint="send" aria-label="Scrivi una richiesta">
      <button type="submit" class="invia" aria-label="Invia">➤</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
