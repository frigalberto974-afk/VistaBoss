<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Promemoria</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Promemoria">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="icona-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header class="testata">
    <h1>Promemoria</h1>
    <p id="adesso" class="sottotitolo"></p>
  </header>

  <section class="segretario pannello" aria-label="Segretario">
    <canvas id="robot" class="robot" aria-label="Tocca il robottino per parlare" role="button" tabindex="0"></canvas>
    <div class="nuvola" aria-live="polite">
      <p id="detto" class="detto"></p>
      <p id="risposta" class="risposta">Ciao! Sono il tuo segretario.</p>
      <div id="conferma" class="conferma" hidden>
        <button id="no" class="pulsante no">No</button>
        <button id="si" class="pulsante si">Sì, confermo</button>
      </div>
      <button id="ascolta-risposta" class="ascolta" hidden>🔊 Ascolta</button>
    </div>
  </section>

  <button id="attiva-notifiche" class="banner" hidden>🔔 Attiva i promemoria sul telefono</button>
  <p id="aiuto-notifiche" class="banner-info" hidden>Per ricevere i promemoria: in Safari tocca Condividi → «Aggiungi alla schermata Home» e apri l'app dall'icona.</p>

  <main class="giornata">
    <section class="pannello">
      <nav id="settimana" class="settimana" aria-label="Giorni della settimana (scorri per cambiare settimana)"></nav>
      <h2 id="titolo-giorno" class="titolo-sezione"></h2>
    <ul id="elenco" class="elenco" aria-live="polite"></ul>
    <p id="vuoto" class="vuoto piccolo" hidden>Nessun appuntamento</p>
    <p id="errore-elenco" class="vuoto" hidden>Non riesco a leggere il calendario. Riprova tra poco.</p>
    </section>

    <section class="pannello">
      <h2 class="titolo-sezione">Cose da fare</h2>
      <ul id="cose" class="elenco-cose"></ul>
      <p id="cose-vuoto" class="vuoto piccolo" hidden>Nessuna cosa da fare</p>
    </section>
  </main>


  <footer class="piede">
    <form id="form-testo" class="form-testo" hidden>
      <input id="testo" type="text" autocomplete="off" enterkeyhint="send" aria-label="Scrivi una richiesta">
      <button type="submit" class="invia" aria-label="Invia">➤</button>
    </form>
    <button id="microfono" class="microfono" aria-label="Parla con l'assistente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span id="stato" class="stato">Tocca e parla</span>
    </button>
  </footer>

  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="app.js"></script>
</body>
</html>
